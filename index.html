<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="description" content="Treno App - Prossimi treni Roma Tiburtina Ponte Di Nona" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <title>Treno App</title>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-top">
        <div class="logo">
          <span class="logo-icon">🚆</span>
          <h1>Treno App</h1>
        </div>
        <div class="clock" id="currentTime">--:--:--</div>
      </div>

      <div class="route-badge" id="routeBadge" title="Tocca per invertire il percorso">
        <span id="routeFrom">Roma Tiburtina</span>
        <span class="route-arrow">⇄</span>
        <span id="routeTo">Ponte Di Nona</span>
      </div>

      <div class="search-bar">
        <div class="field">
          <label for="inputDate">Data</label>
          <input type="date" id="inputDate" />
        </div>
        <div class="field">
          <label for="inputTime">Ora</label>
          <input type="time" id="inputTime" />
        </div>
        <button class="btn btn-primary" id="btnSearch">Cerca</button>
        <button class="btn btn-ghost" id="btnNow" title="Torna all'orario corrente">Adesso</button>
      </div>
    </header>

    <main class="main">
      <div class="results-info" id="resultsInfo" style="display:none"></div>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Ricerca treni in corso...</p>
      </div>

      <div class="error" id="error" style="display:none">
        <p id="errorMessage"></p>
      </div>

      <div class="solutions" id="solutions"></div>
    </main>

    <footer class="footer">
      <span>Dati da lefrecce.it · countdown in tempo reale</span>
    </footer>
  </div>

  <!-- Scheda dettagli (bottom sheet) -->
  <div class="sheet-backdrop" id="sheetBackdrop">
    <div class="sheet" id="sheet" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <div id="sheetContent"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
