<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#12121f" />
  <meta name="description" content="Treno App - Prossimi treni Roma Tiburtina Ponte Di Nona" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <title>PdN Solutions</title>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-top">
        <div class="logo">
          <i data-lucide="train-front" class="ico ico-train"></i>
          <h1>PdN Solutions</h1>
          <i data-lucide="bus-front" class="ico ico-bus"></i>
        </div>
        <div class="clock" id="currentTime">--:--:--</div>
      </div>

      <div class="search-bar">
        <div class="search-row">
          <div class="field">
            <label for="inputDate">Data</label>
            <input type="date" id="inputDate" />
          </div>
          <div class="field">
            <label for="inputTime">Ora</label>
            <input type="time" id="inputTime" />
          </div>
          <button class="btn btn-ghost" id="btnNow" title="Torna all'orario corrente">Adesso</button>
          <button class="btn btn-refresh" id="btnRefresh" title="Aggiorna treni e bus">⟳</button>
        </div>
        <button class="btn btn-primary btn-search" id="btnSearch">Cerca</button>
      </div>

      <nav class="tabs">
        <button class="tab active" id="tabTreni" type="button"><i data-lucide="train-front" class="ico"></i> Treni</button>
        <button class="tab" id="tabBus" type="button"><i data-lucide="bus-front" class="ico"></i> Bus 555</button>
      </nav>
    </header>

    <main class="main">
      <section id="pageTreni">
        <div class="route-badge" id="routeBadge" title="Tocca per invertire il percorso">
          <span id="routeFrom">Roma Tiburtina</span>
          <span class="route-arrow">⇄</span>
          <span id="routeTo">Ponte Di Nona</span>
        </div>
        <br>

        <div class="results-info" id="resultsInfo" style="display:none"></div>

        <div class="loading" id="loading">
          <div class="spinner"></div>
          <p>Ricerca treni in corso...</p>
        </div>

        <div class="error" id="error" style="display:none">
          <p id="errorMessage"></p>
        </div>

        <div class="solutions" id="solutions"></div>
      </section>

      <section id="pageBus" style="display:none">
        <div class="bus-card">
          <div class="bus-head">
            <div>
              <h2><i data-lucide="bus-front" class="ico ico-bus"></i> Linea 555</h2>
              <span class="bus-sub">Palina Ponte Di Nona · capolinea</span>
            </div>
            <button class="btn btn-refresh" id="btnBusRefresh" title="Aggiorna tempo reale">⟳</button>
          </div>

          <h3 class="bus-section">In tempo reale</h3>
          <div id="busLive">
            <div class="bus-row muted">Aggiornamento…</div>
          </div>

          <h3 class="bus-section">Prossime partenze da Ponte Di Nona</h3>
          <div id="busNext">
            <div class="bus-row muted">Calcolo…</div>
          </div>

          <div class="bus-updated" id="busUpdated"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>Dati: viaggiatreno.it (treni) · romamobilita.it GTFS-RT (bus 555)</span>
    </footer>
  </div>

  

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
