name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepara cartella web (www)
        run: |
          mkdir -p www/icons
          cp index.html app.js styles.css manifest.webmanifest service-worker.js schedule-555.json www/
          cp icons/icon.svg www/icons/

      - name: Installa Capacitor
        run: |
          npm init -y
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Aggiunge piattaforma Android
        run: npx cap add android

      - name: Personalizza icone e manifest (prima del sync)
        run: |
          # Rimuove SOLO le icone adaptive (anydpi-v26), che hanno priorità sui PNG
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          # Sovrascrive i PNG di default con le icone personalizzate
          cp resources/android-icons/mipmap-mdpi.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp resources/android-icons/mipmap-hdpi.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp resources/android-icons/mipmap-xhdpi.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp resources/android-icons/mipmap-xxhdpi.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp resources/android-icons/mipmap-xxxhdpi.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          # Abilita HTTP in chiaro per viaggiatreno.it tramite network security config
          mkdir -p android/app/src/main/res/xml
          cp resources/android/network_security_config.xml android/app/src/main/res/xml/network_security_config.xml
          # Inietta il riferimento nel manifest (dopo il tag <manifest ...>)
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:networkSecurityConfig="@xml\/network_security_config"/' android/app/src/main/AndroidManifest.xml

      - name: Sincronizza file web in Android
        run: npx cap sync android

      - name: Compila APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rinomina APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/pontedinona-tiburtina-app-release.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: treno-app-debug-apk
          path: android/app/build/outputs/apk/debug/pontedinona-tiburtina-app-release.apk

      - name: Pubblica Release (tag latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Rimuove asset con nomi vecchi dalla release latest (se esistono)
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || exit 0
          for a in $(gh release view latest --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
            if [ "$a" != "pontedinona-tiburtina-app-release.apk" ]; then
              gh release delete-asset latest "$a" --yes --repo "$GITHUB_REPOSITORY" || true
            fi
          done

      - name: Upload release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: APP TRENO - ultima versione
          body: |
            APK debug aggiornato automaticamente ad ogni push su main.
            Scarica **pontedinona-tiburtina-app-release.apk** qui sotto e installalo sul telefono (consenti "app da origini sconosciute").
          files: android/app/build/outputs/apk/debug/pontedinona-tiburtina-app-release.apk
          overwrite_files: true
          make_latest: true
