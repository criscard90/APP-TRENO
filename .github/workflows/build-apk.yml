name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepara cartella web (www)
        run: |
          mkdir -p www/icons
          cp index.html app.js styles.css manifest.webmanifest service-worker.js www/
          cp icons/icon.svg www/icons/

      - name: Installa Capacitor
        run: |
          npm init -y
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Aggiunge piattaforma Android
        run: npx cap add android

      - name: Sincronizza file web in Android
        run: npx cap sync android

      - name: Abilita HTTP in chiaro (viaggiatreno.it usa http://)
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Rimuove icone Capacitor di default
        run: |
          # Le icone adaptive (anydpi-v26) hanno priorità sui PNG: le cancello
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          # Rimuove i PNG di default di Capacitor (non le cartelle!)
          rm -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          rm -f android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          rm -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          rm -f android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          rm -f android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          rm -f android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          rm -f android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          rm -f android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          rm -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          rm -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Copia icone Android
        run: |
          cp resources/android-icons/mipmap-mdpi.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp resources/android-icons/mipmap-hdpi.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp resources/android-icons/mipmap-xhdpi.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp resources/android-icons/mipmap-xxhdpi.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp resources/android-icons/mipmap-xxxhdpi.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Compila APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: treno-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
